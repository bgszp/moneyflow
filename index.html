<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoneyFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-50 pb-20">

    <!-- Header & Saldo -->
    <header class="bg-blue-600 text-white p-5 rounded-b-3xl shadow-md">
        <h1 class="text-xl font-bold text-center mb-4">MoneyFlow</h1>
        <div class="bg-white/20 p-4 rounded-xl text-center backdrop-blur-sm">
            <p class="text-sm opacity-80 mb-1">Sisa Saldo Saat Ini</p>
            <h2 class="text-3xl font-bold" id="total-saldo">Rp 0</h2>
        </div>
        <div class="flex justify-between mt-4 text-sm">
            <div class="text-center w-1/2 border-r border-white/20">
                <p class="opacity-80">Pemasukan</p>
                <p class="font-bold text-green-300" id="total-masuk">Rp 0</p>
            </div>
            <div class="text-center w-1/2">
                <p class="opacity-80">Pengeluaran</p>
                <p class="font-bold text-red-300" id="total-keluar">Rp 0</p>
            </div>
        </div>
    </header>

    <!-- Form Input Cepat -->
    <main class="p-4 mt-2 max-w-md mx-auto">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-700 mb-4">Catat Transaksi</h3>
            
            <form id="form-transaksi" class="space-y-4">
                <!-- Jenis Transaksi -->
                <div class="flex gap-2">
                    <button type="button" id="btn-keluar" class="w-1/2 py-2 bg-red-100 text-red-600 font-bold rounded-lg border-2 border-red-500 transition">Pengeluaran</button>
                    <button type="button" id="btn-masuk" class="w-1/2 py-2 bg-gray-100 text-gray-500 font-bold rounded-lg border-2 border-transparent transition">Pemasukan</button>
                </div>
                <input type="hidden" id="jenis-transaksi" value="Pengeluaran">

                <!-- Nominal -->
                <div>
                    <label class="text-xs text-gray-500 font-semibold mb-1 block">Nominal (Rp)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400">Rp</span>
                        <input type="number" id="nominal" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 pl-10 pr-3 focus:outline-none focus:border-blue-500 text-lg font-bold" placeholder="0" required>
                    </div>
                </div>

                <!-- Kategori & Dompet -->
                <div class="flex gap-3">
                    <div class="w-1/2">
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Kategori</label>
                        <select id="kategori" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 px-3 focus:outline-none focus:border-blue-500">
                            <!-- Opsi akan dirender via JS -->
                        </select>
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Metode</label>
                        <select id="metode" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 px-3 focus:outline-none focus:border-blue-500">
                            <option value="Cash">Cash</option>
                            <option value="BCA">BCA</option>
                            <option value="Mandiri">Mandiri</option>
                            <option value="Gopay">Gopay</option>
                        </select>
                    </div>
                </div>

                <!-- Tombol Simpan -->
                <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-blue-700 active:scale-95 transition flex justify-center items-center">
                    <i class="fas fa-save mr-2"></i> <span>Simpan Catatan</span>
                </button>
            </form>
        </div>

        <!-- Daftar Transaksi -->
        <div class="mt-6">
            <h3 class="font-bold text-gray-700 mb-3">Riwayat Transaksi</h3>
            <div id="list-transaksi" class="space-y-3">
                <div class="text-center text-sm text-gray-400 py-4">Memuat data...</div>
            </div>
        </div>
    </main>

    <!-- Integrasi Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Konfigurasi dari Firebase Console Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDY411UF58rDGlNG4wRJBpXmsJdlzJuak4",
            authDomain: "moneyflow-3d5b9.firebaseapp.com",
            projectId: "moneyflow-3d5b9",
            storageBucket: "moneyflow-3d5b9.firebasestorage.app",
            messagingSenderId: "499496121372",
            appId: "1:499496121372:web:587ae40a8af2127cbe5bd9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const transactionsRef = collection(db, "transactions");

        // UI Logic
        const btnKeluar = document.getElementById('btn-keluar');
        const btnMasuk = document.getElementById('btn-masuk');
        const inputJenis = document.getElementById('jenis-transaksi');
        const selectKategori = document.getElementById('kategori');
        
        const catPengeluaran = ['Makan', 'Bensin', 'Nongkrong', 'Jajan', 'Lainnya'];
        const catPemasukan = ['Gaji', 'Freelance', 'Lainnya'];

        function renderKategori(jenis) {
            const options = jenis === 'Pengeluaran' ? catPengeluaran : catPemasukan;
            selectKategori.innerHTML = options.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        function setTab(jenis) {
            inputJenis.value = jenis;
            renderKategori(jenis);
            if(jenis === 'Pengeluaran') {
                btnKeluar.className = "w-1/2 py-2 bg-red-100 text-red-600 font-bold rounded-lg border-2 border-red-500 transition";
                btnMasuk.className = "w-1/2 py-2 bg-gray-100 text-gray-500 font-bold rounded-lg border-2 border-transparent transition";
            } else {
                btnMasuk.className = "w-1/2 py-2 bg-green-100 text-green-600 font-bold rounded-lg border-2 border-green-500 transition";
                btnKeluar.className = "w-1/2 py-2 bg-gray-100 text-gray-500 font-bold rounded-lg border-2 border-transparent transition";
            }
        }

        btnKeluar.addEventListener('click', () => setTab('Pengeluaran'));
        btnMasuk.addEventListener('click', () => setTab('Pemasukan'));
        
        // Inisialisasi awal
        setTab('Pengeluaran');

        // Helper Format Rupiah
        const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);

        // Submit Data ke Firestore
        document.getElementById('form-transaksi').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Menyimpan...';

            const nominalVal = Number(document.getElementById('nominal').value);
            
            try {
                await addDoc(transactionsRef, {
                    jenis: inputJenis.value,
                    nominal: nominalVal,
                    kategori: selectKategori.value,
                    metode: document.getElementById('metode').value,
                    timestamp: serverTimestamp()
                });
                document.getElementById('nominal').value = ''; // Reset form
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Gagal menyimpan data!");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fas fa-save mr-2"></i> <span>Simpan Catatan</span>';
            }
        });

        // Real-time Listener Firestore
        const q = query(transactionsRef, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const listEl = document.getElementById('list-transaksi');
            let totalMasuk = 0;
            let totalKeluar = 0;
            
            if (snapshot.empty) {
                listEl.innerHTML = '<div class="text-center text-sm text-gray-400 py-4">Belum ada transaksi</div>';
                document.getElementById('total-saldo').innerText = 'Rp 0';
                document.getElementById('total-masuk').innerText = 'Rp 0';
                document.getElementById('total-keluar').innerText = 'Rp 0';
                return;
            }

            let htmlContent = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                
                // Kalkulasi Saldo
                if(data.jenis === 'Pemasukan') totalMasuk += data.nominal;
                else totalKeluar += data.nominal;

                // Render UI List
                const isKeluar = data.jenis === 'Pengeluaran';
                const colorClass = isKeluar ? 'text-red-500' : 'text-green-500';
                const sign = isKeluar ? '-' : '+';
                const icon = isKeluar ? 'fa-arrow-down bg-red-100 text-red-500' : 'fa-arrow-up bg-green-100 text-green-500';

                htmlContent += `
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center ${icon}">
                            <i class="fas ${icon.split(' ')[0]}"></i>
                        </div>
                        <div>
                            <p class="font-bold text-gray-700 text-sm">${data.kategori}</p>
                            <p class="text-xs text-gray-400">${data.metode}</p>
                        </div>
                    </div>
                    <p class="font-bold ${colorClass}">${sign} ${formatRp(data.nominal)}</p>
                </div>`;
            });

            listEl.innerHTML = htmlContent;
            
            // Update Dashboard
            const saldo = totalMasuk - totalKeluar;
            document.getElementById('total-saldo').innerText = formatRp(saldo);
            document.getElementById('total-masuk').innerText = formatRp(totalMasuk);
            document.getElementById('total-keluar').innerText = formatRp(totalKeluar);
        });
    </script>
</body>
</html>
