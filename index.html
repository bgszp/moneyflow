<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MoneyFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Menghilangkan panah pada input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-gray-50 pb-20">

    <!-- Header & Saldo -->
    <header class="bg-blue-600 text-white p-5 rounded-b-3xl shadow-md">
        <h1 class="text-xl font-bold text-center mb-4">MoneyFlow</h1>
        <div class="bg-white/20 p-4 rounded-xl text-center backdrop-blur-sm">
            <p class="text-sm opacity-80 mb-1">Sisa Saldo Bulan Ini</p>
            <h2 class="text-3xl font-bold" id="total-saldo">Rp 0</h2>
        </div>
        <div class="flex justify-between mt-4 text-sm">
            <div class="text-center w-1/2 border-r border-white/20">
                <p class="opacity-80">Pemasukan</p>
                <p class="font-bold text-green-300" id="total-masuk">Rp 0</p>
            </div>
            <div class="text-center w-1/2">
                <p class="opacity-80">Pengeluaran</p>
                <p class="font-bold text-red-300" id="total-keluar">Rp 0</p>
            </div>
        </div>
    </header>

    <!-- Form Input Cepat -->
    <main class="p-4 mt-2 max-w-md mx-auto">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-700 mb-4">Catat Transaksi</h3>
            
            <form id="form-transaksi" class="space-y-4">
                <!-- Jenis Transaksi -->
                <div class="flex gap-2">
                    <button type="button" id="btn-keluar" class="w-1/2 py-2 bg-red-100 text-red-600 font-bold rounded-lg border-2 border-red-500 transition" onclick="setJenis('Pengeluaran')">Pengeluaran</button>
                    <button type="button" id="btn-masuk" class="w-1/2 py-2 bg-gray-100 text-gray-500 font-bold rounded-lg border-2 border-transparent transition" onclick="setJenis('Pemasukan')">Pemasukan</button>
                </div>
                <input type="hidden" id="jenis-transaksi" value="Pengeluaran">

                <!-- Nominal -->
                <div>
                    <label class="text-xs text-gray-500 font-semibold mb-1 block">Nominal (Rp)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400">Rp</span>
                        <input type="number" id="nominal" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 pl-10 pr-3 focus:outline-none focus:border-blue-500 text-lg font-bold" placeholder="0" required>
                    </div>
                </div>

                <!-- Kategori & Dompet -->
                <div class="flex gap-3">
                    <div class="w-1/2">
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Kategori</label>
                        <select id="kategori" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 px-3 focus:outline-none focus:border-blue-500">
                            <option value="Makan">Makan</option>
                            <option value="Bensin">Bensin</option>
                            <option value="Nongkrong">Nongkrong</option>
                            <option value="Jajan">Jajan</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div class="w-1/2">
                        <label class="text-xs text-gray-500 font-semibold mb-1 block">Metode</label>
                        <select id="metode" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-3 px-3 focus:outline-none focus:border-blue-500">
                            <option value="Cash">Cash</option>
                            <option value="BCA">BCA</option>
                            <option value="Mandiri">Mandiri</option>
                            <option value="Gopay">Gopay</option>
                        </select>
                    </div>
                </div>

                <!-- Tombol Simpan -->
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-blue-700 active:scale-95 transition">
                    <i class="fas fa-save mr-2"></i> Simpan Catatan
                </button>
            </form>
        </div>

        <!-- Daftar Transaksi Terakhir -->
        <div class="mt-6">
            <h3 class="font-bold text-gray-700 mb-3">Hari Ini</h3>
            <div id="list-transaksi" class="space-y-3">
                <!-- Data akan dimuat via JS/Firebase di sini -->
                <div class="text-center text-sm text-gray-400 py-4" id="empty-state">Belum ada transaksi</div>
            </div>
        </div>
    </main>

    <script>
        // Logika sederhana untuk UI sebelum Firebase masuk
        let jenisAktif = 'Pengeluaran';

        function setJenis(jenis) {
            jenisAktif = jenis;
            document.getElementById('jenis-transaksi').value = jenis;
            
            const btnKeluar = document.getElementById('btn-keluar');
            const btnMasuk = document.getElementById('btn-masuk');

            if(jenis === 'Pengeluaran') {
                btnKeluar.className = "w-1/2 py-2 bg-red-100 text-red-600 font-bold rounded-lg border-2 border-red-500 transition";
                btnMasuk.className = "w-1/2 py-2 bg-gray-100 text-gray-500 font-bold rounded-lg border-2 border-transparent transition";
                
                // Ubah opsi kategori
                document.getElementById('kategori').innerHTML = `
                    <option value="Makan">Makan</option>
                    <option value="Bensin">Bensin</option>
                    <option value="Nongkrong">Nongkrong</option>
                    <option value="Lainnya">Lainnya</option>
                `;
            } else {
                btnMasuk.className = "w-1/2 py-2 bg-green-100 text-green-600 font-bold rounded-lg border-2 border-green-500 transition";
                btnKeluar.className = "w-1/2 py-2 bg-gray-100 text-gray-500 font-bold rounded-lg border-2 border-transparent transition";
                
                // Ubah opsi kategori
                document.getElementById('kategori').innerHTML = `
                    <option value="Gaji">Gaji</option>
                    <option value="Freelance">Freelance</option>
                    <option value="Lainnya">Lainnya</option>
                `;
            }
        }

        // Handle Form Submit (Sementara - Local Data)
        document.getElementById('form-transaksi').addEventListener('submit', function(e) {
            e.preventDefault();
            const nominal = document.getElementById('nominal').value;
            const kategori = document.getElementById('kategori').value;
            const metode = document.getElementById('metode').value;

            // Hapus teks "Belum ada transaksi"
            const emptyState = document.getElementById('empty-state');
            if(emptyState) emptyState.remove();

            // Format Rupiah
            const formatRp = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(nominal);
            
            // Warna text berdasarkan jenis
            const colorClass = jenisAktif === 'Pengeluaran' ? 'text-red-500' : 'text-green-500';
            const sign = jenisAktif === 'Pengeluaran' ? '-' : '+';
            const icon = jenisAktif === 'Pengeluaran' ? 'fa-arrow-down bg-red-100 text-red-500' : 'fa-arrow-up bg-green-100 text-green-500';

            // Tambah elemen list baru
            const list = document.getElementById('list-transaksi');
            const newItem = document.createElement('div');
            newItem.className = 'bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center';
            newItem.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center ${icon}">
                        <i class="fas ${icon.split(' ')[0]}"></i>
                    </div>
                    <div>
                        <p class="font-bold text-gray-700 text-sm">${kategori}</p>
                        <p class="text-xs text-gray-400">${metode}</p>
                    </div>
                </div>
                <p class="font-bold ${colorClass}">${sign} ${formatRp}</p>
            `;
            
            list.prepend(newItem); // Tambah di paling atas
            document.getElementById('nominal').value = ''; // Reset input
        });
    </script>
</body>
</html>
