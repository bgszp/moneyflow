<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner & Penyalin Nomor</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f4f4f9; 
            margin: 0; 
        }
        
        /* Kamera diperkecil menjadi kotak scanner */
        .kamera-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            height: 120px; /* Tinggi kamera diperkecil */
            margin: 20px auto;
            border: 4px solid #00ff00; /* Border hijau langsung di kameranya */
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Fitur ini memotong bagian kamera yang berlebih agar pas di kotak */
        }

        button { 
            padding: 12px 15px; 
            font-size: 15px; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .btn-biru { background-color: #007bff; color: white; }
        .btn-biru:hover { background-color: #0056b3; }
        .btn-kuning { background-color: #f0ad4e; color: white; }
        .btn-kuning:hover { background-color: #ec971f; }
        button:disabled { background-color: #ccc !important; cursor: not-allowed; color: #666; box-shadow: none; }
        
        #hasil-scan { 
            width: 90%; 
            max-width: 350px; 
            height: 45px; 
            font-size: 22px; 
            font-weight: bold; 
            margin: 15px 0; 
            padding: 10px; 
            text-align: center; 
            letter-spacing: 2px; 
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        #status { color: #555; font-weight: bold; margin-bottom: 10px; min-height: 20px; }
    </style>
</head>
<body>

    <h2>Scanner Nomor 📷</h2>
    <p style="color: #666; font-size: 14px;">Paskan nomor penuh di dalam kotak hijau, lalu Scan!</p>

    <!-- Kamera sekarang hanya sebesar kotak hijau -->
    <div class="kamera-container">
        <video id="kamera" autoplay playsinline></video>
    </div>
    
    <div id="status">Menyalakan kamera...</div>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div>
        <button id="btn-scan" class="btn-biru">📸 Ambil & Scan</button>
        <button id="btn-ulangi" class="btn-kuning" style="display:none;">🔄 Ulangi Kamera</button>
    </div>
    
    <input type="text" id="hasil-scan" placeholder="Hasil di sini..." readonly>
    <br>
    <button id="btn-copy" class="btn-biru" disabled>📋 Salin Nomor</button>

    <script>
        const video = document.getElementById('kamera');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnScan = document.getElementById('btn-scan');
        const btnUlangi = document.getElementById('btn-ulangi');
        const btnCopy = document.getElementById('btn-copy');
        const hasilScan = document.getElementById('hasil-scan');
        const statusTeks = document.getElementById('status');

        navigator.mediaDevices.getUserMedia({ 
            video: { 
                facingMode: 'environment', 
                width: { ideal: 1280 }, 
                height: { ideal: 720 },
                advanced: [{ focusMode: "continuous" }]
            } 
        }).then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => { statusTeks.innerText = "Siap digunakan."; };
        }).catch(err => {
            statusTeks.innerText = "Error: Kamera tidak dapat diakses.";
        });

        btnScan.addEventListener('click', () => {
            video.pause(); // Hentikan kamera (menjadi foto)
            
            btnScan.style.display = "none";
            btnUlangi.style.display = "inline-block";
            btnCopy.disabled = true;
            hasilScan.value = "";
            statusTeks.innerText = "Menganalisa angka... Mohon tunggu.";
            statusTeks.style.color = "#f0ad4e";

            // PERHITUNGAN CROP (Mencocokkan apa yang terlihat di layar dengan gambar asli)
            const vWidth = video.videoWidth;
            const vHeight = video.videoHeight;
            
            // Rasio kotak di layar adalah 350x120 (sekitar 2.91)
            const targetRatio = 350 / 120;
            const videoRatio = vWidth / vHeight;
            
            let cropW, cropH;
            
            // Logika untuk mengambil hanya bagian TENGAH kamera (sesuai yang tampil di layar)
            if (videoRatio > targetRatio) {
                cropH = vHeight;
                cropW = vHeight * targetRatio;
            } else {
                cropW = vWidth;
                cropH = vWidth / targetRatio;
            }
            
            const cropX = (vWidth - cropW) / 2;
            const cropY = (vHeight - cropH) / 2;

            canvas.width = cropW;
            canvas.height = cropH;
            
            // Potong gambar yang diproses agar sama persis dengan yang dilihat pengguna
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.9);

            Tesseract.recognize(imageData, 'eng')
            .then(({ data: { text } }) => {
                const hanyaAngka = text.replace(/[^0-9]/g, '');

                if (hanyaAngka) {
                    hasilScan.value = hanyaAngka;
                    statusTeks.innerText = "Nomor berhasil disalin ke layar!";
                    statusTeks.style.color = "#5cb85c";
                    btnCopy.disabled = false;
                } else {
                    statusTeks.innerText = "Nomor tidak terdeteksi. Silakan ulangi.";
                    statusTeks.style.color = "#d9534f";
                }
            }).catch(err => {
                statusTeks.innerText = "Gagal memindai.";
                statusTeks.style.color = "#d9534f";
            });
        });

        btnUlangi.addEventListener('click', () => {
            video.play(); // Nyalakan kamera lagi
            btnScan.style.display = "inline-block";
            btnUlangi.style.display = "none";
            btnCopy.disabled = true;
            hasilScan.value = "";
            statusTeks.innerText = "Siap digunakan.";
            statusTeks.style.color = "#555";
        });

        btnCopy.addEventListener('click', () => {
            hasilScan.select();
            hasilScan.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(hasilScan.value).then(() => {
                alert("Berhasil disalin: " + hasilScan.value);
            });
        });
    </script>
</body>
</html>
